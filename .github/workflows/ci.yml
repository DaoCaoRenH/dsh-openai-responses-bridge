name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check out matching DSH
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: dsh-v0.1.2-alpha.2
          path: .ci/deepseek-harness
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: .ci/deepseek-harness/pnpm-lock.yaml

      - name: Install matching DSH workspace
        shell: bash
        run: |
          set -euo pipefail
          dsh_root="$GITHUB_WORKSPACE/.ci/deepseek-harness"
          bridge_root="$dsh_root/packages/bridge/dsh-openai-responses-bridge"
          mkdir -p "$bridge_root"
          git -C "$GITHUB_WORKSPACE" archive --format=tar HEAD | tar -x -C "$bridge_root"
          pnpm --dir "$dsh_root" install --no-frozen-lockfile --ignore-scripts

      - name: Build matching DSH libraries
        shell: bash
        working-directory: .ci/deepseek-harness
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { spawnSync } from 'node:child_process'
          import ts from 'typescript'

          const parsed = ts.readConfigFile('tsconfig.host.json', path => readFileSync(path, 'utf8'))
          if (parsed.error !== undefined) {
            console.error(ts.formatDiagnosticsWithColorAndContext([parsed.error], {
              getCanonicalFileName: fileName => fileName,
              getCurrentDirectory: () => process.cwd(),
              getNewLine: () => '\n',
            }))
            process.exit(1)
          }
          const references = parsed.config?.references?.map(reference => reference.path) ?? []
          if (references.length === 0) throw new Error('tsconfig.host.json has no project references')
          const result = spawnSync(process.execPath, [
            '--max-old-space-size=4096',
            './node_modules/typescript/bin/tsc',
            '-b',
            '--force',
            ...references,
          ], { stdio: 'inherit' })
          if (result.error !== undefined) throw result.error
          process.exit(result.status ?? 1)
          NODE
          pnpm exec tsdown --env.DSH_BUILD_FACE host
          pnpm exec tsc -b tsconfig.client.json --force
          pnpm exec tsdown --env.DSH_BUILD_FACE client

      - name: Run checks
        working-directory: .ci/deepseek-harness
        run: pnpm --filter dsh-openai-responses-bridge run check

      - name: Build bundle
        working-directory: .ci/deepseek-harness
        run: pnpm --filter dsh-openai-responses-bridge run build

      - name: Verify generated output
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          diff -ru \
            "$GITHUB_WORKSPACE/lib" \
            "$GITHUB_WORKSPACE/.ci/deepseek-harness/packages/bridge/dsh-openai-responses-bridge/lib"
